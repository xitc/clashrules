port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: warning
external-controller: :9090
dns:
  enable: true
  ipv6: false     
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:    
    - geosite:private
    - geosite:category-ntp
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  respect-rules: true
proxies: ~
proxy-groups:
  - name: 默认
    type: select
    proxies: [DIRECT]
  
  - name: emby
    type: select
    proxies: [默认,DIRECT]

  - name: trackerslist
    type: select
    proxies: [DIRECT,默认]
  
  - name: YouTube
    type: select
    proxies: [默认,DIRECT]

  - name: Google
    type: select
    proxies: [默认,DIRECT]

  - name: Github
    type: select
    proxies:  [默认,DIRECT]

  - name: Microsoft
    type: select
    proxies:  [默认,DIRECT]

  - name: Telegram
    type: select
    proxies: [默认,DIRECT]

  - name: Twitter
    type: select
    proxies: [默认,DIRECT]

  - name: 国外AI
    type: select
    proxies: [默认,DIRECT]

  - name: NETFLIX
    type: select
    proxies: [默认,DIRECT]

  - name: 国内
    type: select
    proxies:  [DIRECT,默认]

  - name: 其他
    type: select
    proxies:  [默认,DIRECT]

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
  private:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
  emby:
    <<: *domain
    url: https://github.com/xitc/clashrules/releases/download/v0.1/emby.mrs
  trackerslist:
    <<: *domain
    url: https://github.com/xitc/clashrules/releases/download/v0.1/trackerslist.mrs
  youtube:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
  google:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs
  microsoft@cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft@cn.mrs
  github:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs
  microsoft:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs
  telegram:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs
  twitter:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/twitter.mrs
  ai-!cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
  netflix:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
  game-platforms-download@cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download@cn.mrs
  games-!cn@cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games-!cn@cn.mrs
  cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
  geolocation-!cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs
  private_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
  telegram_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs
  twitter_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/twitter.mrs
  netflix_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs
  google_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs
  cn_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,trackerslist,trackerslist
  - RULE-SET,emby,emby
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,microsoft@cn,国内
  - RULE-SET,github,Github
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,telegram,Telegram
  - RULE-SET,twitter,Twitter
  - RULE-SET,ai-!cn,国外AI
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,game-platforms-download@cn,国内
  - RULE-SET,games-!cn@cn,国内
  - RULE-SET,cn,国内
  - RULE-SET,geolocation-!cn,其他
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,twitter_ip,Twitter
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,google_ip,Google
  - RULE-SET,cn_ip,国内
  - MATCH,其他  